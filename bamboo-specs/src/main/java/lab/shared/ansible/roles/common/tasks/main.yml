---
- name: Base packages
  ansible.builtin.apt:
    name: [curl, gnupg, ca-certificates, apt-transport-https]
    state: present
    update_cache: true

# Swap, bridge modules and sysctls are cluster-node preparation. The data and
# opensearch VMs are not cluster nodes and must not be touched by it — HDFS in
# particular has no reason to run with swap off.
- name: Cluster-node kernel preparation
  ansible.builtin.include_tasks: cluster_node.yml
  when: inventory_hostname in groups['k8s_nodes'] | default([])

# Every host ships its logs to OpenSearch except the opensearch nodes
# themselves — they are the destination, not a source, and shipping their own
# service logs back into the cluster they are still forming has no upside.
- name: Fluent Bit log shipping
  ansible.builtin.include_tasks: fluentbit.yml
  when:
    - "'opensearch' in (addons | default('')).split(',')"
    - inventory_hostname not in groups['opensearch_master'] | default([])

# Terminals such as ghostty and kitty send a TERM whose terminfo entry the
# VM's ncurses does not carry, and full-screen tools then abort on login with
# an unreadable "Error: exit status 1" (k9s does exactly this). Fall back to a
# terminfo entry the VM does have, so k9s works on the first ssh.
- name: Terminfo fallback for unknown TERM values
  ansible.builtin.copy:
    dest: /etc/profile.d/10-terminfo-fallback.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by forge-lab (ansible role: common)
      if [ -n "$TERM" ] && [ "$TERM" != dumb ] \
          && ! infocmp -x "$TERM" >/dev/null 2>&1; then
          TERM=xterm-256color
          export TERM
      fi
